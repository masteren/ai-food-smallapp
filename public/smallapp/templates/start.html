<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI冷蔵庫システム | 起動</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo_new.png') }}">
  <style>
    :root {
      --yellow-bg: #ffd74f;
      --text-dark: #0d1b2a;
      --text-light: rgba(13, 27, 42, 0.72);
      --line-track: rgba(13, 27, 42, 0.28);
      --line-fill: #0ea5e9;
      --panel-bg: rgba(255, 255, 255, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--yellow-bg);
      color: var(--text-dark);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--yellow-bg);
      isolation: isolate;
    }

    .scan-reveal {
      position: absolute;
      inset: 0;
      background: url("{{ url_for('static', filename='main_background.png') }}") center / cover no-repeat;
      clip-path: inset(0 100% 0 0);
      animation: reveal-bg 2.8s ease-in-out forwards;
      z-index: 1;
    }

    .scan-reveal::after {
      content: "";
      position: absolute;
      top: 0;
      right: -3px;
      width: 7px;
      height: 100%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.0));
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.55);
    }

    .scan-tint {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 16, 34, 0.28), rgba(11, 16, 34, 0.48));
      opacity: 0;
      animation: tint-in 0.8s ease forwards;
      animation-delay: 2.0s;
      z-index: 2;
      pointer-events: none;
    }

    .progress-wrap {
      position: absolute;
      left: clamp(12px, 2.2vw, 28px);
      top: 24px;
      bottom: 24px;
      width: 54px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      z-index: 4;
    }

    .progress-track {
      position: relative;
      width: 4px;
      height: 100%;
      border-radius: 999px;
      background: var(--line-track);
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 0%;
      border-radius: 999px;
      background: linear-gradient(180deg, #0ea5e9, #2563eb);
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.45);
      transform-origin: top;
    }

    .progress-percent {
      position: absolute;
      left: calc(50% + 10px);
      top: 0%;
      transform: translateY(-50%);
      min-width: 96px;
      font-size: clamp(32px, 3.6vw, 44px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #f6ef22;
      text-shadow: 0 0 8px rgba(246, 239, 34, 0.22);
      transition: top 0.06s linear;
      white-space: nowrap;
    }

    .center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 5;
      padding: 18px;
    }

    .title-panel {
      text-align: center;
      padding: 20px 28px;
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 32px rgba(13, 27, 42, 0.20);
      min-width: min(86vw, 560px);
      pointer-events: none;
      opacity: 0.95;
      transition: all 0.25s ease;
    }

    .title-main {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .title-sub {
      margin: 10px 0 0;
      font-size: clamp(13px, 1.3vw, 18px);
      color: var(--text-light);
      letter-spacing: 0.18em;
    }

    .enter-hint {
      margin-top: 16px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      letter-spacing: 0.1em;
    }

    .ready .title-panel {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(11, 16, 34, 0.35);
      border-color: rgba(255, 255, 255, 0.72);
      color: #fff;
    }

    .ready .title-sub {
      color: rgba(255, 255, 255, 0.84);
    }

    .ready .enter-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(11, 16, 34, 0.36);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 9;
    }

    .loading-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.12);
      padding: 12px;
      box-shadow: 0 10px 28px rgba(13, 27, 42, 0.34);
      animation: icon-blink 0.2s ease-in-out infinite;
    }

    .entering .loading-overlay {
      opacity: 1;
    }

    .entering .title-panel {
      opacity: 0.35;
    }

    @keyframes reveal-bg {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes fill-down {
      from { height: 0%; }
      to { height: 100%; }
    }

    @keyframes tint-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes icon-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.93); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-reveal,
      .progress-fill,
      .scan-tint {
        animation: none;
      }
      .scan-reveal { clip-path: inset(0 0 0 0); }
      .progress-fill { height: 100%; }
      .scan-tint { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="scan-reveal" aria-hidden="true"></div>
    <div class="scan-tint" aria-hidden="true"></div>

    <div class="progress-wrap" aria-hidden="true">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <section class="center">
      <div class="title-panel" id="enterPanel" role="button" tabindex="0" aria-label="ホームに移動">
        <h1 class="title-main">AI冷蔵庫システム</h1>
        <p class="title-sub">スマート食材管理・栄養最適化プラットフォーム</p>
        <div class="enter-hint">読み込み完了。ここをクリックして開始</div>
      </div>
    </section>
    <div class="loading-overlay" aria-hidden="true">
      <img class="loading-icon" src="{{ url_for('static', filename='big_logo.png') }}" alt="">
    </div>
  </main>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const panel = document.getElementById("enterPanel");
      const reveal = document.querySelector(".scan-reveal");
      const progressFill = document.querySelector(".progress-fill");
      const progressPercent = document.getElementById("progressPercent");
      const homeUrl = "{{ url_for('home') }}";
      let ready = false;
      let entering = false;
      let readyTimer = null;
      let progressDone = false;

      function enterHome() {
        if (!ready || entering) {
          return;
        }
        entering = true;
        stage.classList.add("entering");
        setTimeout(() => {
          window.location.replace(homeUrl);
        }, 550);
      }

      function markReady() {
        if (ready) {
          return;
        }
        ready = true;
        stage.classList.add("ready");
      }

      function startProgressTicker() {
        if (!progressPercent || !progressFill) {
          return;
        }
        const durationMs = 2700;
        const startedAt = performance.now();

        function tick(now) {
          if (progressDone) {
            return;
          }
          const elapsed = now - startedAt;
          const ratio = Math.min(1, Math.max(0, elapsed / durationMs));
          // Keep number and bar in the same curve so they stay aligned.
          const visualRatio = 1 - ((1 - ratio) * (1 - ratio));
          const percent = Math.round(visualRatio * 100);
          progressFill.style.height = percent + "%";
          progressPercent.textContent = percent + "%";
          progressPercent.style.top = percent + "%";
          if (ratio < 1) {
            requestAnimationFrame(tick);
            return;
          }
          progressPercent.style.display = "none";
          progressDone = true;
        }

        requestAnimationFrame(tick);
      }

      function scheduleReady() {
        if (readyTimer) {
          clearTimeout(readyTimer);
        }
        readyTimer = setTimeout(markReady, 350);
      }

      if (reveal) {
        reveal.addEventListener("animationend", scheduleReady, { once: true });
      }
      startProgressTicker();
      // Fallback in case animationend does not fire.
      setTimeout(markReady, 3600);

      // If the page is restored from browser back-forward cache, clear transient loading state.
      window.addEventListener("pageshow", (event) => {
        if (!event.persisted) {
          return;
        }
        entering = false;
        stage.classList.remove("entering");
      });

      panel.addEventListener("click", enterHome);
      panel.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          enterHome();
        }
      });
    })();
  </script>
</body>
</html>
