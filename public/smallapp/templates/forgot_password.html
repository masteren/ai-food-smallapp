{% extends "base.html" %}
{% set title="パスワード再設定 | AI Pantry OS" %}
{% set header_title="パスワード再設定" %}
{% set header_subtitle="案内ページ" %}

{% block content %}
  <section class="card soft" style="max-width:820px; width:100%; margin:32px auto 0;">
    <h2 style="margin-top:0; font-size:36px; line-height:1.3;">パスワードを忘れた場合</h2>
    <p style="font-size:18px; line-height:1.7; color:var(--muted2);">
      現在の体験用環境では、セルフサービスでのパスワード再設定は未対応です。
      パスワードの再設定が必要な場合は、管理者へ連絡してください。
    </p>
    <div class="u-mt16" style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn primary" href="{{ url_for('auth') }}">ログイン画面に戻る</a>
      <a class="btn" href="{{ url_for('home') }}">ホームへ戻る</a>
    </div>
  </section>
{% endblock %}
